[strings]
prompt_path = 请输入存放地图碎片的文件夹路径:
prompt_compress = 请输入压缩后的目标大小(MB, 例如 10)，直接回车则不压缩:
err_path_not_found = 错误: 提供的路径不是一个有效的文件夹。
info_starting = 程序启动。
info_scanning = 正在扫描文件夹...
info_stitching = 正在拼接地图:
info_stitch_success = -> 拼接完成, 保存至:
info_compressing = 正在压缩地图:
info_compress_success = -> 压缩成功! 质量: {quality}%%, 大小: {size:.2f} MB, 保存至: {path}
info_compress_warning = -> 警告: 即使在最低质量({quality}%%)下, 文件大小仍超过目标。已保存为当前最低质量。
info_compress_error = -> 压缩图片时发生错误: {error}
info_stitch_error = -> 处理地图 '{map_name}' 时发生错误: {error}
err_no_files_found = 警告: 在指定目录中未找到任何符合要求格式 ('..._X_Y.bmp') 的图片文件。
info_done = 所有任务已完成。
info_press_enter = 按 Enter 键退出...